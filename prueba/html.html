<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Animación</title>
  <link rel="stylesheet" href="css.css">
</head>
<body>

  <h1 class="animar">Bienvenido a mi página</h1>
  <p class="animar">Este texto aparece con una animación suave</p>


  <div class="card">
  <img src="LOGO.jpg" alt="Personaje" class="card-img">

  <div class="card-content">
    <h3>Nombre del personaje</h3>
    <p>Descripción breve del personaje.</p>
  </div>

  <button class="btn-toggle">Ver más</button>

  <div class="card-extra">
    <p>Más información del personaje, habilidades, historia, etc.</p>
  </div>
</div>
</body>
  <script src="java.js"></script>

</html>
